name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # OpenCV loads libGL when imported, even though the tests draw nothing. ffmpeg re-encodes
      # the annotated video for browsers, and one test runs it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Tests use synthetic signals only; the private videos are not in the repo.
      - name: Test
        run: pytest
