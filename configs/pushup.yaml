# Push-up configuration. Every threshold needs a comment saying why it has that value.
# The values are starting points, tuned against the labelled training clips in Phase 5.
exercise: pushup

# How reps are found and measured (pipeline/reps.py).
segmentation:
  # A shoulder-ankle line steeper than this is standing or kneeling, not a push-up.
  # Push-ups measured 0-10 deg; standing ~85 deg.
  max_tilt_deg: 35

  # Detection dropouts up to this many frames (~0.17 s at 30 fps) are bridged by a straight
  # line. Longer gaps mean the person left the frame and stay unknown.
  max_gap_frames: 5

  # Savitzky-Golay window. Needed for the hip-duration thresholds, which jitter breaks.
  # It also lifts the bottom of narrow dips by a few degrees, so tune it together with the
  # shallow threshold, not separately.
  smoothing_window_s: 0.4

  # A dip counts as a rep bottom only if it spans this share of the clip's upper-arm range
  # (5th-95th percentile). Relative, so it works at any camera distance.
  min_prominence_fraction: 0.3

  # No two rep bottoms closer than this. The fastest reps filmed took ~1.4 s.
  min_rep_spacing_s: 0.8

  # If the upper-arm range (5th-95th percentile) over the whole window is below this, the
  # clip has no reps: the relative prominence above would otherwise accept jitter dips.
  # Smallest range with real reps: 15 deg (clip03, piked and shallow); a held pause at the
  # top spans ~6 deg (clip11).
  min_range_deg: 10

  # A rep counts only if the person climbs back up at least this share of a typical rep.
  # Measured: a failed rep 0.33, the lowest completed rep 0.52. A second failed rep (0.64)
  # cannot be told apart from a no-lockout rep (0.63) by this signal.
  min_return_fraction: 0.45

  # Hip metrics use only frames where the upper arm is below this share of the way from the
  # rep's bottom to its top. At the top the person settles into the plank, pauses or starts
  # getting up, and the hip moves while the arms stay still. Measured on 11 clips with the
  # planned 15 deg / 0.3 s rules: pike false alarms 12 -> 5 at 0.9, no labelled fault lost;
  # 0.8 starts losing real sags.
  hip_moving_fraction: 0.9

  # Sag / pike durations count the time the hip spends beyond these many degrees below /
  # above the body line. Each hip rule must use its own number, so each is defined once here
  # (&sag_threshold, &pike_threshold) and reused by its rule below (*sag_threshold, ...).
  # Separate because they are different faults: lowering one shared value to catch small
  # sags added pike false alarms (EXPERIMENTS.md, no. 9).
  # Sag: the smallest labelled sags drop 12.5-15.4 deg; clean reps peak at 12.6 (clip16).
  sag_threshold_deg: &sag_threshold 13
  pike_threshold_deg: &pike_threshold 15

# Fault rules (pipeline/rules.py). Each rule reads one Rep field (metric) and flags the rep
# when the value is above max or below min. A NaN metric (a landmark outside the frame) is
# "could not evaluate", never "no fault". Rule names match the columns of data/labels.csv,
# so Phase 5 compares predictions with labels without a mapping table.
# Values started as guesses; the ones tuned in Phase 5 point to their EXPERIMENTS.md entry.
# title names the check to a user; message tells them what to fix. Both are drawn on the
# annotated video, whose fonts only have ASCII: no dashes or quotes beyond the keyboard ones.
rules:
  shallow:
    title: "Depth"
    metric: min_upper_arm_angle
    # 0 deg = upper arm parallel to the floor, the labelling rule's line. Real side views
    # aren't perfect: at the bottom the elbows flare toward the camera, the upper arm is seen
    # partly end-on, and full-depth reps read up to 13.8 deg. Shallow reps read from 16.1.
    # 15 sits in that gap, slightly toward the shallow side: a missed shallow rep is better
    # than telling someone a good rep wasn't deep enough. EXPERIMENTS.md, no. 8.
    max: 15
    # Hips first: on a piked rep, "hips too high" is the cue, and depth reads as shallow
    # when it isn't (the upper arm is seen end-on). Not for hip_sag: depth on sagging reps
    # is measured well, and 21 of 33 sag reps really are shallow too.
    suppressed_by: [hip_pike]
    message: "Not reaching full depth"

  hip_sag:
    title: "Hip sag"
    metric: max_hip_drop
    max: *sag_threshold  # degrees below the shoulder-ankle line
    duration_metric: hip_sag_duration_s
    # A brief dip is noise or a wobble; the labelling rule says "a noticeable part of the
    # rep". 13 deg for 0.2 s catches 20 of 22 sags with no false alarms; the 2 missed (clip05
    # reps 6-7, 12.5 deg) are as small as clean reps get, so catching them costs a false
    # alarm. EXPERIMENTS.md, no. 9.
    min_duration_s: 0.2
    message: "Hips dropping: engage your core"

  hip_pike:
    title: "Hip pike"
    metric: max_hip_rise
    max: *pike_threshold  # degrees above the shoulder-ankle line
    duration_metric: hip_pike_duration_s
    min_duration_s: 0.3
    message: "Hips too high: lower them into a straight line"

  no_lockout:
    title: "Arm lockout"
    metric: max_elbow_angle
    # 180 deg = straight arm, but reps labelled locked out read from 157.5 deg: the labelling
    # rule ignores slight softness in the elbows. No-lockout reps read up to 155.4. 156 sits
    # in that gap, nudged toward missing, as for shallow. EXPERIMENTS.md, no. 10.
    min: 156
    message: "Straighten your arms fully at the top"
