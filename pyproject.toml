[project]
name = "form-coach"
version = "0.1.0"
description = "Analyzes phone video of push-ups and gives per-rep form feedback."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe",        # pose landmarks (Tasks API)
    "opencv-contrib-python",  # video read/write, drawing; the variant mediapipe requires
    "numpy",            # landmark arrays, angle math
    "scipy",            # smoothing, peak finding
    "pyyaml",           # rule config
    "pandas",           # evaluation joins
    "matplotlib",       # dev plots while tuning
    "fastapi",          # web API
    "uvicorn",          # ASGI server for FastAPI
    "python-multipart", # file uploads
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx2",           # FastAPI's TestClient sends requests through it
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python snippets embedded in Markdown; the guide is prose, leave it alone.
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes: undefined names, unused imports
    "I", # isort: import order
    "B", # bugbear: likely bugs
    "UP", # pyupgrade: modern syntax for the target version
    "ANN", # type annotations on every function
]
# Any is the honest type for the JSON conversion in pipeline/session.py (nested dicts, lists and
# numbers of any shape), so it isn't banned.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# pytest calls the tests, nothing else does: "-> None" on each adds nothing a reader needs.
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on the import path so tests can `import pipeline`. `python -m pytest`
# does this by itself; plain `pytest` (which CI runs) does not.
pythonpath = ["."]
filterwarnings = [
    # Raised inside Starlette 1.6's own test client (it uses an anyio alias anyio deprecated),
    # not by this project's code. Remove once Starlette is upgraded past it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
